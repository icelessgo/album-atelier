name: Synthetic checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Backup test dependency
        run: sudo apt-get update && sudo apt-get install -y zstd
      - name: Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Source publication checks
        run: python scripts/check_public_release.py
      - name: Python regression suite
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: JavaScript regression suite
        run: npm test
      - name: Offline synthetic demo and repeatability
        run: |
          python scripts/create_demo.py
          python scripts/create_demo.py
          python scripts/check_public_release.py
